name: Deploy to Hostinger

# Every push to main uploads the web panel (backend/) into Hostinger's public_html by FTP.
# Only changed files are sent after the first upload. Your .env (unless built from secrets),
# uploaded photos/logo (public/storage) and the APK (public/downloads) on the server are never touched.
#
# GitHub → Settings → Secrets and variables → Actions → New repository secret:
#   required  FTP_SERVER, FTP_USERNAME, FTP_PASSWORD        (hPanel → Files → FTP Accounts)
#   optional  FTP_SERVER_DIR   default /public_html/  (folder of the website as the FTP login sees it)
#             FTP_PORT         default 21
#   optional, to write .env on every deploy:
#             APP_KEY, APP_URL, DB_DATABASE, DB_USERNAME, DB_PASSWORD   (and DB_HOST, default localhost)
#   optional, to update the database after each deploy (hPanel → Advanced → SSH Access):
#             SSH_HOST, SSH_USERNAME, SSH_PASSWORD, SSH_PORT (65002), SSH_APP_DIR (e.g. domains/your-domain.com/public_html)

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
      HAS_SSH: ${{ secrets.SSH_HOST != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, zip, pdo_mysql, fileinfo, bcmath
          tools: composer:v2
          coverage: none

      - name: Install PHP packages (production, no dev tools)
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist

      - name: Build the public_html folder
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: php deploy/ci-build.php build

      - name: FTP secrets missing
        if: env.HAS_FTP != 'true'
        run: |
          echo "::error::Add the FTP_SERVER, FTP_USERNAME and FTP_PASSWORD secrets (GitHub → Settings → Secrets and variables → Actions)."
          exit 1

      # forgive common copy-paste mistakes: "ftp://", ":21", spaces / line breaks around the values
      - name: Check the FTP login
        if: env.HAS_FTP == 'true'
        env:
          RAW_SERVER: ${{ secrets.FTP_SERVER }}
          RAW_USER: ${{ secrets.FTP_USERNAME }}
          RAW_PASS: ${{ secrets.FTP_PASSWORD }}
          RAW_PORT: ${{ secrets.FTP_PORT }}
          RAW_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          host=$(printf '%s' "$RAW_SERVER" | tr -d '[:space:]' | sed -E 's#^[a-zA-Z]+://##; s#/.*$##')
          port=$(printf '%s' "$RAW_PORT" | tr -d '[:space:]')
          case "$host" in *:*) [ -z "$port" ] && port="${host##*:}"; host="${host%%:*}";; esac
          port="${port:-21}"
          user=$(printf '%s' "$RAW_USER" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
          pass=$(printf '%s' "$RAW_PASS" | tr -d '\r\n')
          dir=$(printf '%s' "$RAW_DIR" | tr -d '[:space:]'); dir="${dir:-/public_html/}"; case "$dir" in */) ;; *) dir="$dir/";; esac
          echo "::add-mask::$user"; echo "::add-mask::$pass"
          { echo "FTP_HOST=$host"; echo "FTP_PORT_CLEAN=$port"; echo "FTP_USER_CLEAN=$user"; echo "FTP_PASS_CLEAN=$pass"; echo "FTP_DIR_CLEAN=$dir"; } >> "$GITHUB_ENV"
          echo "FTP host: $host  port: $port  folder: $dir"
          # what the secrets look like (never their values) + which server answers, to tell wrong values from a wrong server
          ip=$(getent hosts "$host" | awk '{print $1}' | head -1)
          banner=$(timeout 10 bash -c "exec 3<>/dev/tcp/$host/$port && head -1 <&3" 2>/dev/null | tr -d '\r')
          shape="username: ${#user} chars"
          [ -z "$user" ] && shape="username: EMPTY (secret FTP_USERNAME not found: check the name, and that it is a Repository secret, not a Variable)"
          case "$user" in *@*) shape="$shape, looks like an e-mail (FTP usernames on Hostinger look like u123456789 or u123456789.your-domain.com)";; esac
          echo "$user" | grep -Eq '^u[0-9]{6,}(\.|$)' && shape="$shape, Hostinger style (u…)"
          [ -z "$pass" ] && shape="$shape; password: EMPTY (secret FTP_PASSWORD not found)" || shape="$shape; password: ${#pass} chars"
          echo "::notice title=FTP check::server $host ($ip) answers: ${banner:-no answer} | $shape"
          if ! listing=$(curl -sS --max-time 30 --ftp-pasv --user "$user:$pass" "ftp://$host:$port/" --list-only 2>&1); then
            case "$listing" in
              *530*|*"Access denied"*|*"Login denied"*) echo "::error title=FTP login refused (530)::Hostinger rejected the FTP username/password. In hPanel → Files → FTP Accounts copy the FTP username exactly (it often looks like u123456789.your-domain.com), set a new FTP password there, and save both again in GitHub secrets FTP_USERNAME / FTP_PASSWORD (not your hPanel e-mail or login password).";;
              *"resolve host"*|*"Could not resolve"*) echo "::error title=FTP host not found::FTP_SERVER '$host' does not exist. Use the FTP IP or hostname from hPanel → Files → FTP Accounts (no ftp://).";;
              *) echo "::error title=FTP connection failed::$listing";;
            esac
            exit 1
          fi
          echo "::notice title=FTP login OK::Folders at the FTP root: $(printf '%s' "$listing" | tr '\r\n' '  ' | head -c 300)"

      - name: Upload to Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USER_CLEAN }}
          password: ${{ env.FTP_PASS_CLEAN }}
          port: ${{ env.FTP_PORT_CLEAN }}
          local-dir: ./build/
          server-dir: ${{ env.FTP_DIR_CLEAN }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
          timeout: 600000
          log-level: minimal

      - name: Update the database (only when SSH secrets are set)
        if: env.HAS_SSH == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 65002 }}
          script: |
            cd "${{ secrets.SSH_APP_DIR }}" || exit 1
            php artisan migrate --force
            php artisan optimize:clear
